<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Cricket Registry | Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>if (!localStorage.getItem('cricketUser')) window.location.href = 'login.html';</script>
</head>
<body>
    <div class="stadium-bg-overlay"></div>
    <div id="flash-container"></div>

    <div class="container">
        <nav>
            <div class="nav-top">
                <div class="nav-left">
                    <span class="logo-icon">🏏</span>
                    <div>
                        <span class="logo-name">CRICKET<span class="logo-pro">REGISTRY</span></span>
                    </div>
                </div>
                <div class="nav-right">
                    <div class="nav-user">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <span class="nav-welcome">Welcome, <b id="user-name-display">User</b> (<span id="user-role-display">Fan</span>)</span>
                    </div>
                    <a href="#" onclick="logout()" class="logout-btn">Sign Out ↗</a>
                </div>
            </div>
            <div class="nav-bottom">
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link active">📊 Dashboard</a></li>
                    <li><a href="players.html" class="nav-link">🏏 Players</a></li>
                    <li><a href="teams.html" class="nav-link">🛡️ Teams</a></li>
                </ul>
            </div>
        </nav>

        <header class="page-hero">
            <div>
                <h1 class="page-hero-title">Cricket Team & Player Registry</h1>
                <p class="page-hero-sub">Centralized database for managing teams, players, and statistics.</p>
            </div>
        </header>

        <div class="stats-grid" id="overview-stats">
            <div class="stat-box"><div class="stat-label">Total Teams</div><div class="stat-value" id="stat-teams">—</div></div>
            <div class="stat-box"><div class="stat-label">Total Players</div><div class="stat-value" id="stat-players">—</div></div>
            <div class="stat-box"><div class="stat-label">Registered Fans</div><div class="stat-value" id="stat-fans">—</div></div>
        </div>

    </div>

    <script src="logic.js"></script>
</body>
</html>
