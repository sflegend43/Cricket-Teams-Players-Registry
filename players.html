<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Registry | Players</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>if (!localStorage.getItem('cricketUser')) window.location.href = 'login.html';</script>
</head>
<body>
    <div class="stadium-bg-overlay"></div>
    <div class="container">
        <nav>
            <div class="nav-top">
                <div class="nav-left">
                    <span class="logo-icon">🏏</span>
                    <span class="logo-name">CRICKET<span class="logo-pro">REGISTRY</span></span>
                </div>
                <div class="nav-right">
                    <a href="index.html" class="nav-link">Back to Dashboard</a>
                    <a href="#" onclick="logout()" class="logout-btn">Sign Out</a>
                </div>
            </div>
        </nav>

        <section class="glass-card admin-only" style="margin-bottom: 2rem;">
            <h2>Add New Player (Admin Only)</h2>
            <form id="add-player-form" style="display: flex; gap: 1rem; align-items: end; flex-wrap: wrap;">
                <div><label>Name</label><input type="text" id="p-name" required class="form-control"></div>
                <div><label>DOB (YYYY-MM-DD)</label><input type="date" id="p-dob" required class="form-control"></div>
                <div><label>Nationality</label><input type="text" id="p-nat" required class="form-control"></div>
                <div><label>Role</label><select id="p-role" class="form-control"><option>Batsman</option><option>Bowler</option><option>AllRounder</option></select></div>
                <div><label>Team</label><input type="text" id="p-team" required class="form-control"></div>
                <button type="submit" class="btn btn-primary">Add Player</button>
            </form>
        </section>
        
        <section class="glass-card" id="stats-form-container" style="display:none; margin-bottom: 2rem;">
            <h2 style="color:var(--gold);">Update Stats (<span id="editing-player-name"></span>)</h2>
            <form id="update-stats-form" style="display: flex; gap: 1rem; align-items: end;">
                <input type="hidden" id="edit-p-id">
                <div><label>Matches</label><input type="number" id="edit-matches" class="form-control"></div>
                <div><label>Runs</label><input type="number" id="edit-runs" class="form-control"></div>
                <div><label>Wickets</label><input type="number" id="edit-wickets" class="form-control"></div>
                <button type="submit" class="btn" style="background:var(--gold); color:#000;">Save Stats</button>
                <button type="button" class="btn" onclick="document.getElementById('stats-form-container').style.display='none'">Cancel</button>
            </form>
        </section>

        <section class="glass-card">
            <h2>Player Registry</h2>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr><th>Name</th><th>Role</th><th>Team</th><th>M</th><th>R</th><th>W</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="players-tbody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="players.js"></script>
</body>
</html>
