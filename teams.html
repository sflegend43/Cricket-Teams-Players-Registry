<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Registry | Teams</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>if (!localStorage.getItem('cricketUser')) window.location.href = 'login.html';</script>
</head>
<body>
    <div class="stadium-bg-overlay"></div>
    <div id="flash-container"></div>

    <div class="container">
        <nav>
            <div class="nav-top">
                <div class="nav-left">
                    <span class="logo-icon">🏏</span>
                    <span class="logo-name">CRICKET<span class="logo-pro">REGISTRY</span></span>
                </div>
                <div class="nav-right">
                    <a href="index.html" class="nav-link">Back to Dashboard</a>
                    <a href="#" onclick="logout()" class="logout-btn">Sign Out</a>
                </div>
            </div>
        </nav>

        <section class="glass-card admin-only" style="margin-bottom: 2rem;">
            <h2>Add New Team (Admin Only)</h2>
            <form id="add-team-form" style="display: flex; gap: 1rem; align-items: end;">
                <div><label>Team Name</label><input type="text" id="t-name" required class="form-control"></div>
                <div><label>Country</label><input type="text" id="t-country" required class="form-control"></div>
                <div><label>Coach</label><input type="text" id="t-coach" class="form-control"></div>
                <button type="submit" class="btn btn-primary">Add Team</button>
            </form>
        </section>

        <section class="glass-card">
            <h2>Registered Teams</h2>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr><th>Team Name</th><th>Country</th><th>Coach</th><th class="admin-only">Actions</th></tr>
                    </thead>
                    <tbody id="teams-tbody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="teams.js"></script>
</body>
</html>
